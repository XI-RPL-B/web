<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#EDEFF7">
    <title>Galeri XI RPL-B</title>

    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/galeri.css">

    <script src="assets/js/theme.js"></script>
</head>
<body>

    <div class="container">

        <div class="page-head">
            <div>
                <span class="lbl"><span id="jumlahFoto">0</span> foto tersimpan</span>
                <h1>&#128444;&#65039; <span>Galeri</span></h1>
            </div>
            <a href="menu.html" class="pill">&larr; Menu</a>
        </div>

        <p class="catatan" id="catatanAkses"></p>

        <div class="card" id="formGaleri">

            <span class="lbl">Tambah foto</span>

            <input type="file" id="berkasFoto" accept="image/*" multiple hidden>

            <div class="area-pilih" id="areaPilih">
                <div class="ikon">&#128247;</div>
                <span>Ketuk untuk memilih foto</span>
                <small>Bisa pilih beberapa sekaligus &middot; JPG, PNG, WEBP</small>
            </div>

            <div class="antrian" id="antrian" style="display:none"></div>

            <input type="text" id="judulFoto" placeholder="Keterangan foto (boleh dikosongi)" maxlength="70">

            <button id="tambahFoto" disabled>Tambahkan</button>

            <p class="bantuan">
                Foto otomatis dikecilkan di HP-mu sebelum dikirim, jadi tidak
                menghabiskan kuota dan tetap muat di database gratis.
            </p>

        </div>

        <div id="daftarFoto" class="galeri-grid"></div>

    </div>

    <nav class="bottom-nav">

        <div class="indicator"></div>

        <a href="dashboard.html" class="nav-item"><i>&#9670;</i><span>Beranda</span></a>
        <a href="jadwal.html" class="nav-item"><i>&#128197;</i><span>Jadwal</span></a>
        <a href="kas.html" class="nav-item"><i>&#128176;</i><span>Kas</span></a>
        <a href="absensi.html" class="nav-item"><i>&#128221;</i><span>Absensi</span></a>
        <a href="menu.html" class="nav-item"><i>&#9776;</i><span>Menu</span></a>

    </nav>

    <!-- Sinkronisasi antar perangkat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/galeri.js"></script>
    <script src="assets/js/navbar.js"></script>

</body>
</html>
